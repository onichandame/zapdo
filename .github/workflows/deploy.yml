name: Deploy

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    name: Deploy to Environment
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    env:
      ENV_NAME: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      DB_NAME: ${{ github.ref == 'refs/heads/main' && 'zapdo-db' || 'zapdo-db-dev' }}
      DEPLOY_URL: ${{ github.ref == 'refs/heads/main' && 'https://zapdo.onichandame.com' || 'https://zapdo-dev.onichandame.com' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.2.1'
          cache: 'npm'

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
          key: ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Type check and lint
        run: npm run check

      - name: Build application
        run: npm run build

      - name: Test migrations on local database
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply ${{ env.DB_NAME }} --local --env ${{ env.ENV_NAME }}

      - name: Run database migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply ${{ env.DB_NAME }} --env ${{ env.ENV_NAME }} --remote

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env ${{ env.ENV_NAME }}

      - name: Verify deployment
        run: |
          echo "🚀 Deployed to: $DEPLOY_URL"
          
          for i in {1..10}; do
            if curl -f -s "$DEPLOY_URL" > /dev/null; then
              echo "✅ Deployment verified - site is accessible"
              break
            else
              echo "⏳ Waiting for deployment to propagate... (attempt $i/10)"
              sleep 6
            fi
          done
